services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-events}
      POSTGRES_USER: ${POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-events}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${VALKEY_PORT:-56379}:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    ports:
      - '127.0.0.1:${ADMINER_PORT:-8080}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  otel-desktop-viewer:
    image: ghcr.io/ctrlspice/otel-desktop-viewer:v0.4.1
    command:
      - --host
      - 0.0.0.0
      - --grpc
      - '4317'
      - --http
      - '4318'
      - --browser-port
      - '8000'
      - --db
      - /data/telemetry.duckdb
    ports:
      - '127.0.0.1:8000:8000' # viewer UI
      - '127.0.0.1:4317:4317' # OTLP/gRPC
      - '127.0.0.1:4318:4318' # OTLP/HTTP
    volumes:
      - telemetry_data:/data

volumes:
  postgres_data:
  valkey_data:
  telemetry_data:
